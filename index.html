<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f2744">
  <title>UMC NICU Tools</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #0f172a; background: #f8fafc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { background: linear-gradient(135deg,#0f2744,#1d4ed8); color: white; padding: 56px 20px; }
    header div, main { max-width: 920px; margin: auto; }
    h1 { margin: 0; font-size: clamp(2rem,6vw,3.4rem); }
    header p { color: #dbeafe; font-size: 1.05rem; }
    main { padding: 32px 20px; }
    .card { display: block; padding: 24px; border: 1px solid #cbd5e1; border-radius: 18px; background: white; box-shadow: 0 8px 25px #0f172a12; color: inherit; text-decoration: none; transition: .2s; }
    .card:hover { transform: translateY(-2px); border-color: #2563eb; box-shadow: 0 12px 30px #1d4ed81f; }
    .tag { display: inline-block; background: #dcfce7; color: #166534; padding: 4px 9px; border-radius: 999px; font-size: .75rem; font-weight: 800; }
    h2 { margin: 12px 0 5px; }
    .muted { color: #64748b; }
  </style>
</head>
<body>
  <header><div><h1>UMC NICU Tools</h1><p>Practical clinical tools for the Neonatal Intensive Care Unit at Umar Medical Complex.</p></div></header>
  <main>
    <a class="card" href="./radiology-request/">
      <span class="tag">AVAILABLE</span>
      <h2>NICU Radiology Request Portal</h2>
      <div class="muted">Create, verify, print and share structured neonatal radiology requisitions.</div>
    </a>
  </main>
</body>
</html>
